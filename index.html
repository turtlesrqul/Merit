<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grid Production Twin</title>
<meta name="description" content="3D digital twin of the Grid production and store rooms: SMT lines, Hybrid Room, Laser Room, HASS and Core X at true scale.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="css/style.css">
<script>
// 3D engine: the normal address uses three.js r160 (WebGL). ?engine=webgpu (or webgpu-webgl) loads three.js r187 with its WebGPU renderer. See js/engine.js.
(function () {
  var e = (new URLSearchParams(location.search).get('engine') || '').toLowerCase();
  var next = e === 'webgpu' || e === 'webgpu-webgl';
  var imports = next
    ? { 'three': './vendor/three-r187/three.webgpu.js', 'three/orbit': './vendor/three-r187/OrbitControls.js' }
    : { 'three': './vendor/three/three.module.min.js', 'three/orbit': './vendor/three/OrbitControls.js' };
  document.write('<script type="importmap">' + JSON.stringify({ imports: imports }) + '<\/script>');
})();
</script>
</head>
<body>
<div id="stage" role="img" aria-label="Interactive 3D model of the Grid production and store rooms"></div>

<header class="bar">
  <div class="brand">
    <h1>GRID PRODUCTION TWIN</h1>
    <p><span id="status" class="pill pill-none"><i></i><b id="statusText">No live data</b></span><span id="clock" class="clock"></span></p>
  </div>
  <nav class="ctrls" aria-label="Controls">
    <div class="menu">
      <button id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="menuPanel">VIEW: <span id="viewName">3D</span>
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2"/></svg></button>
      <div class="menu-panel" id="menuPanel" hidden>
        <p class="mh">CAMERA</p>
        <button id="vIso" aria-pressed="true">3D overview</button>
        <button id="vTop" aria-pressed="false">Top view</button>
        <button id="vSmt" aria-pressed="false">SMT lines</button>
        <button id="vHyb" aria-pressed="false">Hybrid Room</button>
        <button id="vWhs" aria-pressed="false">Smart Warehouse</button>
        <p class="mh">DISPLAY</p>
        <button id="tWalls" aria-pressed="true">Walls</button>
        <button id="tWh" aria-pressed="true" title="Show or hide the Smart Warehouse">Warehouse</button>
        <button id="tTour" aria-pressed="false" title="Slowly orbit the floor, for a wall screen">Tour (slow orbit)</button>
        <button id="tFull" aria-pressed="false">Full screen</button>
        <button id="tPanels" aria-pressed="false" title="Hide the controls and the equipment list, for a wall screen (key H)">Hide panels</button>
        <p class="mh">DATA</p>
        <button id="tDemo" aria-pressed="false" title="Fill the twin with made-up machine states to show how it looks with live data">Demo data</button>
      </div>
    </div>
    <button id="tEdit" aria-pressed="false" title="Drag machines to new positions">EDIT LAYOUT</button>
  </nav>
</header>

<button id="showPanels" class="show-panels" hidden title="Show the controls and the equipment list (key H)">
  <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>PANELS</span>
</button>

<aside class="panel list" id="listPanel" aria-label="Equipment">
  <div class="panel-head">
    <h2>EQUIPMENT</h2>
    <button id="listToggle" class="icon" aria-expanded="true" aria-controls="listBody" aria-label="Collapse equipment list">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 15l6-6 6 6" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </div>
  <div id="listBody">
    <div class="summary" id="summary"></div>
    <label class="search" for="q"><span class="sr">Find equipment</span>
      <input id="q" type="search" placeholder="Find a machine, room or ID" autocomplete="off">
    </label>
    <div class="groups" id="groups"></div>
  </div>
</aside>

<aside class="panel detail" id="detail" hidden aria-live="polite">
  <div class="panel-head">
    <h2 id="dName"></h2>
    <button id="dClose" class="icon" aria-label="Close details">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2"/></svg>
    </button>
  </div>
  <dl id="dBody"></dl>
  <p class="link"><a id="dLink" href="#">Link to this machine</a></p>
</aside>

<div class="editbar" id="editBar" hidden role="toolbar" aria-label="Layout editing">
  <p><b>EDITING LAYOUT</b><span id="editMsg">Drag a machine to move it · R rotates · Ctrl+C / Ctrl+V copies it · arrow keys nudge 10 cm</span></p>
  <div class="eb">
    <button id="eRot">ROTATE 90°</button>
    <button id="eCp" title="Copy the selected machine (Ctrl+C)">COPY</button>
    <button id="ePaste" title="Paste a copy (Ctrl+V pastes at the pointer)">PASTE</button>
    <button id="eDel" title="Delete a pasted copy (Delete)">DELETE</button>
    <button id="eUndo">UNDO</button>
    <button id="eReset">RESET ALL</button>
    <button id="eExport">DOWNLOAD LAYOUT</button>
    <button id="eCopy">COPY LAYOUT</button>
    <button id="eDone" aria-pressed="true">DONE</button>
  </div>
</div>
<div class="tip" id="tip" hidden><b id="tipT"></b><span id="tipS"></span></div>
<noscript><p class="nojs">This twin needs JavaScript and WebGL.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>

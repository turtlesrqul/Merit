<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">Merit V4 visual direction poster</title>
  <desc id="desc">Open Design-style brand poster for Merit V4 showing proof over pedigree, proof cards, recruiter signal, palette, and logo marks.</desc>
  <defs>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#101010" stroke-width="1" opacity=".055"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#101010" flood-opacity=".18"/>
    </filter>
  </defs>
  <rect width="1600" height="1100" fill="#f7f3ea"/>
  <rect width="1600" height="1100" fill="url(#grid)"/>
  <circle cx="140" cy="90" r="360" fill="#d6a72c" opacity=".16"/>
  <circle cx="1490" cy="140" r="340" fill="#2f6fed" opacity=".12"/>

  <text x="56" y="62" font-family="Consolas, monospace" font-size="16" letter-spacing="3" fill="#70695d">MERIT / V4 OPEN DESIGN BOARD / PROOF LAYER</text>
  <text x="56" y="1010" font-family="Consolas, monospace" font-size="14" letter-spacing="3" fill="#70695d">PASSPORT / PROOF CARD / MATCH SIGNAL / RECRUITER CONFIDENCE</text>
  <text x="1544" y="62" text-anchor="end" font-family="Consolas, monospace" font-size="16" letter-spacing="3" fill="#70695d">SINGAPORE / MMXXVI</text>

  <g transform="translate(56 145)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="128" font-weight="800" fill="#101010">Proven</text>
    <text x="0" y="132" font-family="Georgia, serif" font-size="142" font-style="italic" fill="#101010">by work</text>
    <circle cx="545" cy="106" r="15" fill="#b85c38"/>
    <text x="0" y="195" font-family="Arial, sans-serif" font-size="28" fill="#3f392f">Merit turns student work into recruiter-readable proof.</text>
    <text x="0" y="238" font-family="Arial, sans-serif" font-size="28" fill="#3f392f">Not a portfolio. Not a job board. A proof-of-ability layer.</text>
  </g>

  <g transform="translate(58 470)">
    <circle cx="96" cy="96" r="92" fill="#fffdf8" stroke="#101010" stroke-width="2"/>
    <text x="96" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#101010">52.9K</text>
    <text x="96" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="13" letter-spacing="2" fill="#70695d">GRADUATES / YR</text>
    <circle cx="318" cy="96" r="92" fill="#fffdf8" stroke="#70695d" stroke-width="2" stroke-dasharray="8 8"/>
    <text x="318" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#101010">77.6K</text>
    <text x="318" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="13" letter-spacing="2" fill="#70695d">PAID SEGMENT</text>
    <circle cx="540" cy="96" r="92" fill="#fffdf8" stroke="#b85c38" stroke-width="2"/>
    <text x="540" y="87" text-anchor="middle" font-family="Arial, sans-serif" font-size="38" font-weight="800" fill="#b85c38">2-SIDED</text>
    <text x="540" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="13" letter-spacing="2" fill="#70695d">MARKETPLACE</text>
  </g>

  <g transform="translate(815 130)" filter="url(#shadow)">
    <rect x="0" y="0" width="520" height="410" fill="#fffdf8" stroke="#101010" stroke-width="2"/>
    <rect x="28" y="28" width="464" height="230" fill="#ede4d4" stroke="#dcd2c0"/>
    <rect x="58" y="62" width="260" height="22" fill="#2f6fed" opacity=".72"/>
    <rect x="58" y="104" width="370" height="16" fill="#101010" opacity=".14"/>
    <rect x="58" y="136" width="300" height="16" fill="#101010" opacity=".14"/>
    <rect x="58" y="168" width="220" height="16" fill="#1e8a5a" opacity=".68"/>
    <text x="28" y="302" font-family="Consolas, monospace" font-size="15" letter-spacing="2" fill="#b85c38">PROVES / PRODUCT THINKING</text>
    <text x="28" y="350" font-family="Arial, sans-serif" font-size="42" font-weight="800" fill="#101010">Proof Card</text>
    <text x="28" y="382" font-family="Arial, sans-serif" font-size="20" fill="#4a4338">Artifact, role, skill, outcome, fit.</text>
  </g>

  <g transform="translate(1020 500)" filter="url(#shadow)">
    <rect x="0" y="0" width="440" height="396" fill="#101010" stroke="#101010" stroke-width="2"/>
    <text x="28" y="48" font-family="Consolas, monospace" font-size="15" letter-spacing="2" fill="#d6a72c">RECRUITER SIGNAL</text>
    <text x="28" y="105" font-family="Arial, sans-serif" font-size="44" font-weight="800" fill="#fffdf8">Strong fit</text>
    <text x="28" y="144" font-family="Arial, sans-serif" font-size="20" fill="#d8d0c0">Match is visible evidence mapped to role intent.</text>
    <g transform="translate(28 188)">
      <rect width="384" height="58" fill="#fffdf8" opacity=".1" stroke="#fffdf8" stroke-opacity=".2"/>
      <circle cx="29" cy="29" r="10" fill="#1e8a5a"/>
      <text x="55" y="35" font-family="Arial, sans-serif" font-size="18" fill="#fffdf8">Project artifact supports role</text>
      <rect y="78" width="384" height="58" fill="#fffdf8" opacity=".1" stroke="#fffdf8" stroke-opacity=".2"/>
      <circle cx="29" cy="107" r="10" fill="#1e8a5a"/>
      <text x="55" y="113" font-family="Arial, sans-serif" font-size="18" fill="#fffdf8">Skills backed by visible work</text>
      <rect y="156" width="384" height="58" fill="#fffdf8" opacity=".1" stroke="#fffdf8" stroke-opacity=".2"/>
      <circle cx="29" cy="185" r="10" fill="#b85c38"/>
      <text x="55" y="191" font-family="Arial, sans-serif" font-size="18" fill="#fffdf8">Missing availability signal</text>
    </g>
  </g>

  <g transform="translate(56 745)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="16" letter-spacing="3" fill="#70695d">PALETTE / V4</text>
    <g transform="translate(0 30)">
      <rect x="0" y="0" width="90" height="90" fill="#101010"/><text x="0" y="118" font-family="Consolas, monospace" font-size="12" fill="#70695d">INK</text>
      <rect x="110" y="0" width="90" height="90" fill="#fffdf8" stroke="#dcd2c0"/><text x="110" y="118" font-family="Consolas, monospace" font-size="12" fill="#70695d">SURFACE</text>
      <rect x="220" y="0" width="90" height="90" fill="#d6a72c"/><text x="220" y="118" font-family="Consolas, monospace" font-size="12" fill="#70695d">SIGNAL</text>
      <rect x="330" y="0" width="90" height="90" fill="#2f6fed"/><text x="330" y="118" font-family="Consolas, monospace" font-size="12" fill="#70695d">PROOF</text>
      <rect x="440" y="0" width="90" height="90" fill="#1e8a5a"/><text x="440" y="118" font-family="Consolas, monospace" font-size="12" fill="#70695d">VALID</text>
      <rect x="550" y="0" width="90" height="90" fill="#b85c38"/><text x="550" y="118" font-family="Consolas, monospace" font-size="12" fill="#70695d">CLAY</text>
    </g>
  </g>

  <g transform="translate(735 725)">
    <text x="0" y="0" font-family="Consolas, monospace" font-size="16" letter-spacing="3" fill="#70695d">MARK ROUTES</text>
    <g transform="translate(0 34)" font-family="Georgia, serif" font-style="italic" font-size="56" fill="#101010">
      <rect x="0" y="0" width="92" height="92" fill="#fffdf8" stroke="#dcd2c0"/><text x="46" y="62" text-anchor="middle">M</text>
      <rect x="108" y="0" width="92" height="92" fill="#fffdf8" stroke="#dcd2c0"/><text x="154" y="62" text-anchor="middle">|M|</text>
      <rect x="216" y="0" width="92" height="92" fill="#fffdf8" stroke="#dcd2c0"/><text x="262" y="62" text-anchor="middle">M^</text>
      <rect x="324" y="0" width="92" height="92" fill="#fffdf8" stroke="#dcd2c0"/><text x="370" y="62" text-anchor="middle">[M]</text>
      <rect x="432" y="0" width="92" height="92" fill="#fffdf8" stroke="#dcd2c0"/><text x="478" y="62" text-anchor="middle">M+</text>
    </g>
  </g>

  <text x="56" y="1080" font-family="Arial, sans-serif" font-size="24" font-weight="800" fill="#101010">Work becomes proof. Proof becomes signal. Signal creates opportunity.</text>
</svg>
